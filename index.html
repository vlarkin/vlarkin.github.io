<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <!-- Instant meta refresh redirect -->
    <meta http-equiv="refresh" content="0; url=https://larkin.com.ua">
    <!-- Fallback JavaScript redirect -->
    <script>
        window.location.href = "https://larkin.com.ua";
    </script>
</head>
<body>
    <p>If you are not redirected automatically, please <a href="https://larkin.com.ua">click here</a>.</p>
</body>
</html>
